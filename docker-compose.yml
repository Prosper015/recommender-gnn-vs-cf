services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Port publie pour acces direct a la doc Swagger (/docs) depuis le host.
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - recommender-network
    # Pas de published port pour le front : il est atteint UNIQUEMENT via le proxy nginx.

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    environment:
      # URL RELATIVE : le frontend appelle /api/* sur la meme origine que le proxy.
      # Marche depuis n'importe quelle machine (le navigateur ne resout jamais "api").
      - VITE_API_URL=/
      - CHOKIDAR_USEPOLLING=true
    networks:
      - recommender-network

  nginx:
    image: nginx:alpine
    ports:
      # Unique point d'entree externe : http://<IP-du-host>/
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app
    networks:
      - recommender-network

networks:
  recommender-network:
    driver: bridge
