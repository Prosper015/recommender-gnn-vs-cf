version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - recommender-network

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    environment:
      - REACT_APP_API_URL=http://api:8000
      - CHOKIDAR_USEPOLLING=true
    networks:
      - recommender-network

networks:
  recommender-network:
    driver: bridge
